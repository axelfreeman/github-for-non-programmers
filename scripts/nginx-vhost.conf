# nginx vhost для статического сайта, развёрнутого РЯДОМ с чужим Docker-приложением.
#
# Задача: твой статик и чужой контейнер делят порт 80 — не сломай соседа.
# Правило: добавь СВОЙ server block по server_name, НЕ трогай чужой. Nginx сам
# разведёт запросы по Host-заголовку.
#
# Статику кладём на хост (/var/www/site), монтируем volume в контейнер nginx,
# в compose добавляем порт 443 и volume /etc/letsencrypt (для HTTPS).

server {
    listen 80;
    server_name example.com www.example.com;

    # ACME challenge для Let's Encrypt (webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/site;
    }

    # всё остальное — на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    root /var/www/site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # кэш на 30 дней для статики
    location ~* \.(jpg|jpeg|png|webp|gif|svg|css|js|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
